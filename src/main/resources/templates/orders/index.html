<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
  <title>주문 내역</title>
</head>
<body>
<div layout:fragment="content">
  <h1 class="text-3xl font-bold mb-6">주문 내역</h1>

  <div id="orders-loading" class="flex justify-center py-12">
    <span class="loading loading-spinner loading-lg"></span>
  </div>

  <div id="orders-empty" class="hidden text-center py-20">
    <div class="text-6xl mb-4">📋</div>
    <p class="text-xl text-base-content/50">주문 내역이 없습니다.</p>
    <a th:href="@{/}" class="btn btn-primary mt-4">쇼핑하러 가기</a>
  </div>

  <div id="orders-list" class="hidden space-y-4"></div>
</div>

<th:block layout:fragment="scripts">
  <script th:src="@{/js/order.js}"></script>
  <script>
    if (!Auth.isLoggedIn()) window.location.href = '/login';
    else loadOrders();
  </script>
</th:block>
</body>
</html>
